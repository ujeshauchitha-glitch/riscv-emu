name: CI

on:
  # Only the default branch on push. Without the branch filter, a push to a
  # branch that also has an open pull request triggers two identical runs -
  # double the time and cost for no extra signal.
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was already running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A warning fails the build in CI, but not for someone building locally on a
  # newer or older compiler with different lints.
  RUSTFLAGS: -D warnings
  # A missing RISC-V toolchain must fail the bare-metal self-tests, not skip them.
  RISCV_EMU_REQUIRE_TOOLCHAIN: "1"

jobs:
  build-and-test:
    name: Build, tests, riscv-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install the RISC-V toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-riscv64-unknown-elf

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: Build
        run: cargo build --release

      # Unit tests, the soft-float and bit-manipulation differential tests
      # against independent Python references, the GDB and network tests, and
      # the bare-metal self-tests assembled with the real toolchain.
      - name: Tests
        run: cargo test --release

      # The official suite the RISC-V project maintains. This is the check that
      # matters most: everything else in this repository was written alongside
      # the emulator and could share a misreading of the specification with it.
      - name: riscv-tests
        run: ./scripts/run-riscv-tests.sh

      - name: Summary
        if: always()
        run: |
          echo "### Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Rust unit/integration tests, differential tests, riscv-tests" >> "$GITHUB_STEP_SUMMARY"
